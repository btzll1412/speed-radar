esphome:
  name: speed-radar
  friendly_name: Speed Radar

esp32:
  board: esp32dev
  framework:
    type: arduino

# External components - the custom HLK-LD2415H component
external_components:
  - source:
      type: local
      path: components

# Ethernet configuration for WT32-ETH02
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_OUT
  phy_addr: 1
  power_pin: GPIO16

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0  # Disable UART logging since we're using UART for radar

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  platform: esphome
  password: !secret ota_password

# UART for HLK-LD2415H radar
uart:
  id: radar_uart
  rx_pin: GPIO5
  tx_pin: GPIO17
  baud_rate: 9600

# HLK-LD2415H radar component
# min_speed_threshold filters out pedestrians and cyclists:
#   - Walking: 3-6 km/h
#   - Jogging: 8-12 km/h
#   - Cycling: 15-25 km/h
# Set to 15 km/h to only detect motor vehicles
hlk_ld2415h:
  id: radar
  uart_id: radar_uart
  min_speed_threshold: 15.0  # Ignore speeds below 15 km/h (filters pedestrians/cyclists)
  max_speed_threshold: 200.0 # Ignore speeds above 200 km/h (filters noise/errors)

# Sensors from the radar component
sensor:
  # Current speed reading
  - platform: hlk_ld2415h
    speed:
      name: "Vehicle Speed"
      id: vehicle_speed
      filters:
        - filter_out: 0

    # Vehicle counts (tracked in C++ component)
    vehicle_count:
      name: "Vehicle Count"
      id: vehicle_count

    approaching_count:
      name: "Approaching Count"
      id: approaching_count

    leaving_count:
      name: "Leaving Count"
      id: leaving_count

    # Speed statistics (calculated in C++ component)
    average_speed:
      name: "Average Speed"
      id: average_speed

    max_speed:
      name: "Max Speed"
      id: max_speed

  # Speed in mph (converted from km/h)
  - platform: template
    name: "Vehicle Speed MPH"
    id: vehicle_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer"
    lambda: |-
      if (id(vehicle_speed).state > 0) {
        return id(vehicle_speed).state * 0.621371;
      }
      return 0;
    update_interval: 500ms

  # Average speed in mph
  - platform: template
    name: "Average Speed MPH"
    id: average_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer-medium"
    lambda: |-
      if (id(average_speed).state > 0) {
        return id(average_speed).state * 0.621371;
      }
      return 0;
    update_interval: 5s

  # Max speed in mph
  - platform: template
    name: "Max Speed MPH"
    id: max_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer"
    lambda: |-
      if (id(max_speed).state > 0) {
        return id(max_speed).state * 0.621371;
      }
      return 0;
    update_interval: 5s

  # Uptime sensor
  - platform: uptime
    name: "Uptime"

# Text sensors
text_sensor:
  - platform: hlk_ld2415h
    direction:
      name: "Direction"
      id: vehicle_direction

# Binary sensors
binary_sensor:
  - platform: hlk_ld2415h
    vehicle_detected:
      name: "Vehicle Detected"
      id: vehicle_detected
      device_class: motion

# Buttons
button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Reset Statistics"
    icon: "mdi:refresh"
    on_press:
      then:
        - lambda: |-
            id(radar).reset_statistics();

# Number inputs for adjusting settings from Home Assistant
number:
  # Filter out slow-moving objects (pedestrians, cyclists)
  - platform: template
    name: "Min Speed Threshold"
    id: min_speed_input
    unit_of_measurement: "km/h"
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    icon: "mdi:speedometer-slow"
    on_value:
      then:
        - lambda: |-
            id(radar).set_min_speed_threshold(x);

  # Filter out noise/errors above this speed
  - platform: template
    name: "Max Speed Threshold"
    id: max_speed_input
    unit_of_measurement: "km/h"
    min_value: 50
    max_value: 300
    step: 10
    initial_value: 200
    optimistic: true
    restore_value: true
    icon: "mdi:speedometer"
    on_value:
      then:
        - lambda: |-
            id(radar).set_max_speed_threshold(x);

  # Time gap (seconds) to consider readings as separate vehicles
  - platform: template
    name: "Vehicle Gap Time"
    id: vehicle_gap_input
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    icon: "mdi:timer-outline"
    on_value:
      then:
        - lambda: |-
            id(radar).set_vehicle_gap_ms((uint32_t)(x * 1000));

  # How long to keep "vehicle detected" on after last reading
  - platform: template
    name: "Detection Timeout"
    id: detection_timeout_input
    unit_of_measurement: "s"
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 2
    optimistic: true
    restore_value: true
    icon: "mdi:timer-off-outline"
    on_value:
      then:
        - lambda: |-
            id(radar).set_detection_timeout_ms((uint32_t)(x * 1000));

# Time for midnight reset
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Reset statistics at midnight
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(radar).reset_statistics();
