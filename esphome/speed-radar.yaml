esphome:
  name: speed-radar
  friendly_name: Speed Radar

esp32:
  board: esp32dev
  framework:
    type: arduino

# External components - the custom HLK-LD2415H component
external_components:
  - source:
      type: local
      path: components

# Ethernet configuration for WT32-ETH02
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_OUT
  phy_addr: 1
  power_pin: GPIO16

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0  # Disable UART logging since we're using UART for radar

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  platform: esphome
  password: !secret ota_password

# =============================================================
# MQTT Configuration for instant bidirectional communication
# =============================================================
# For LOCAL radars: Use your HA's Mosquitto add-on
# For REMOTE radars: Use a cloud MQTT broker or expose Mosquitto
mqtt:
  broker: !secret mqtt_broker        # e.g., 192.168.1.100 or mqtt.example.com
  port: !secret mqtt_port            # Usually 1883 (or 8883 for TLS)
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false                   # Hub handles discovery
  topic_prefix: null                 # We'll use custom topics

  # Subscribe to config changes - INSTANT settings updates!
  on_json_message:
    - topic: !lambda 'return "speed_radar/" + App.get_name() + "/config";'
      then:
        - lambda: |-
            // Apply config changes instantly
            if (x.containsKey("speed_limit")) {
              float val = x["speed_limit"];
              id(speed_limit_input).publish_state(val);
              id(radar).set_speed_limit(val);
              ESP_LOGI("mqtt", "Speed limit updated to %.1f", val);
            }
            if (x.containsKey("min_threshold")) {
              float val = x["min_threshold"];
              id(min_speed_input).publish_state(val);
              id(radar).set_min_speed_threshold(val);
              ESP_LOGI("mqtt", "Min threshold updated to %.1f", val);
            }
            if (x.containsKey("direction_filter")) {
              std::string val = x["direction_filter"];
              uint8_t filter = 0;
              if (val == "approaching") filter = 1;
              else if (val == "leaving") filter = 2;
              id(radar).set_direction_filter(filter);
              ESP_LOGI("mqtt", "Direction filter updated to %s", val.c_str());
            }

  on_connect:
    then:
      - lambda: |-
          ESP_LOGI("mqtt", "Connected to MQTT broker");
      # Publish online status
      - mqtt.publish:
          topic: !lambda 'return "speed_radar/" + App.get_name() + "/status";'
          payload: "online"
          retain: true

  on_disconnect:
    then:
      - lambda: |-
          ESP_LOGW("mqtt", "Disconnected from MQTT broker");

# HTTP Request component (for initial registration only)
http_request:
  useragent: "ESPHome/SpeedRadar"
  timeout: 10s

# Global variables
globals:
  - id: radar_hub_url
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mqtt_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

# UART for HLK-LD2415H radar
uart:
  id: radar_uart
  rx_pin: GPIO5
  tx_pin: GPIO17
  baud_rate: 9600

# HLK-LD2415H radar component
hlk_ld2415h:
  id: radar
  uart_id: radar_uart
  min_speed_threshold: 15.0   # Ignore speeds below 15 km/h (filters pedestrians)
  max_speed_threshold: 200.0  # Ignore speeds above 200 km/h (filters noise)
  speed_limit: 50.0           # Your street's speed limit
  direction_filter: both      # Options: both, approaching, leaving
  angle_compensation: 0.0     # Mounting angle in degrees (0-60)
  speed_offset: 0.0           # Fine-tune offset in km/h (-20 to +20)

# Sensors from the radar component
sensor:
  - platform: hlk_ld2415h
    # Current speed - publishes via MQTT INSTANTLY on every reading
    speed:
      name: "Vehicle Speed"
      on_value:
        then:
          - if:
              condition:
                lambda: 'return id(mqtt_enabled) && x > 0;'
              then:
                - mqtt.publish_json:
                    topic: !lambda 'return "speed_radar/" + App.get_name() + "/speed";'
                    payload: |-
                      root["speed"] = id(vehicle_speed).state;
                      root["direction"] = id(vehicle_direction).state;
                      root["timestamp"] = id(homeassistant_time).now().timestamp;
      id: vehicle_speed
      filters:
        - filter_out: 0

    # Basic counts
    vehicle_count:
      name: "Vehicle Count"
      id: vehicle_count
    approaching_count:
      name: "Approaching Count"
      id: approaching_count
    leaving_count:
      name: "Leaving Count"
      id: leaving_count

    # Speed statistics
    average_speed:
      name: "Average Speed"
      id: average_speed
    max_speed:
      name: "Max Speed"
      id: max_speed

    # Speed limit violations
    speeder_count:
      name: "Speeder Count"
      id: speeder_count
    violation_percentage:
      name: "Violation Percentage"
      id: violation_percentage
    worst_speeder:
      name: "Worst Speeder Over Limit"
      id: worst_speeder

    # Direction-specific averages
    avg_speed_approaching:
      name: "Avg Speed Approaching"
      id: avg_speed_approaching
    avg_speed_leaving:
      name: "Avg Speed Leaving"
      id: avg_speed_leaving

    # Hourly statistics
    current_hour_count:
      name: "Current Hour Count"
      id: current_hour_count
    current_hour_avg_speed:
      name: "Current Hour Avg Speed"
      id: current_hour_avg_speed
    peak_hour:
      name: "Peak Hour"
      id: peak_hour
    peak_hour_count:
      name: "Peak Hour Count"
      id: peak_hour_count

    # 85th percentile (traffic engineering metric)
    percentile_85_speed:
      name: "85th Percentile Speed"
      id: percentile_85_speed

  # Speed in mph (converted from km/h)
  - platform: template
    name: "Vehicle Speed MPH"
    id: vehicle_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer"
    lambda: |-
      if (id(vehicle_speed).state > 0) {
        return id(vehicle_speed).state * 0.621371;
      }
      return 0;
    update_interval: 500ms

  # Average speed in mph
  - platform: template
    name: "Average Speed MPH"
    id: average_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 1
    icon: "mdi:speedometer-medium"
    lambda: |-
      if (id(average_speed).state > 0) {
        return id(average_speed).state * 0.621371;
      }
      return 0;
    update_interval: 5s

  # Uptime sensor
  - platform: uptime
    name: "Uptime"

# Text sensors
text_sensor:
  - platform: hlk_ld2415h
    direction:
      name: "Direction"
      id: vehicle_direction

# Binary sensors
binary_sensor:
  - platform: hlk_ld2415h
    vehicle_detected:
      name: "Vehicle Detected"
      id: vehicle_detected
      device_class: motion
      on_press:
        then:
          # INSTANT publish via MQTT on vehicle detection
          - delay: 300ms  # Brief wait for speed reading
          - if:
              condition:
                lambda: 'return id(mqtt_enabled);'
              then:
                - mqtt.publish_json:
                    topic: !lambda 'return "speed_radar/" + App.get_name() + "/detection";'
                    payload: |-
                      root["event"] = "vehicle_detected";
                      root["speed"] = id(vehicle_speed).state;
                      root["direction"] = id(vehicle_direction).state;
                      root["speeder"] = id(vehicle_speed).state > id(speed_limit_input).state;
                      root["vehicle_count"] = id(vehicle_count).state;
      on_release:
        then:
          - if:
              condition:
                lambda: 'return id(mqtt_enabled);'
              then:
                - mqtt.publish_json:
                    topic: !lambda 'return "speed_radar/" + App.get_name() + "/detection";'
                    payload: |-
                      root["event"] = "vehicle_passed";
                      root["speed"] = id(vehicle_speed).state;
                      root["direction"] = id(vehicle_direction).state;
                      root["vehicle_count"] = id(vehicle_count).state;
                      root["speeder"] = id(vehicle_speed).state > id(speed_limit_input).state;

# Buttons
button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Reset Statistics"
    icon: "mdi:refresh"
    on_press:
      then:
        - lambda: |-
            id(radar).reset_statistics();

# Number inputs for adjusting settings from Home Assistant
number:
  # Speed limit for violation tracking
  - platform: template
    name: "Speed Limit"
    id: speed_limit_input
    unit_of_measurement: "km/h"
    min_value: 10
    max_value: 120
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    icon: "mdi:sign-caution"
    on_value:
      then:
        - lambda: |-
            id(radar).set_speed_limit(x);

  # Filter out slow-moving objects (pedestrians, cyclists)
  - platform: template
    name: "Min Speed Threshold"
    id: min_speed_input
    unit_of_measurement: "km/h"
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    icon: "mdi:speedometer-slow"
    on_value:
      then:
        - lambda: |-
            id(radar).set_min_speed_threshold(x);

  # Filter out noise/errors above this speed
  - platform: template
    name: "Max Speed Threshold"
    id: max_speed_input
    unit_of_measurement: "km/h"
    min_value: 50
    max_value: 300
    step: 10
    initial_value: 200
    optimistic: true
    restore_value: true
    icon: "mdi:speedometer"
    on_value:
      then:
        - lambda: |-
            id(radar).set_max_speed_threshold(x);

  # Time gap (seconds) to consider readings as separate vehicles
  - platform: template
    name: "Vehicle Gap Time"
    id: vehicle_gap_input
    unit_of_measurement: "s"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    icon: "mdi:timer-outline"
    on_value:
      then:
        - lambda: |-
            id(radar).set_vehicle_gap_ms((uint32_t)(x * 1000));

  # How long to keep "vehicle detected" on after last reading
  - platform: template
    name: "Detection Timeout"
    id: detection_timeout_input
    unit_of_measurement: "s"
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 2
    optimistic: true
    restore_value: true
    icon: "mdi:timer-off-outline"
    on_value:
      then:
        - lambda: |-
            id(radar).set_detection_timeout_ms((uint32_t)(x * 1000));

  # Angle compensation for mounting angle
  - platform: template
    name: "Angle Compensation"
    id: angle_compensation_input
    unit_of_measurement: "deg"
    min_value: 0
    max_value: 60
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
    icon: "mdi:angle-acute"
    on_value:
      then:
        - lambda: |-
            id(radar).set_angle_compensation(x);

  # Speed offset for calibration
  - platform: template
    name: "Speed Offset"
    id: speed_offset_input
    unit_of_measurement: "km/h"
    min_value: -20
    max_value: 20
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    icon: "mdi:tune"
    on_value:
      then:
        - lambda: |-
            id(radar).set_speed_offset(x);

# Select for direction filter
select:
  - platform: template
    name: "Direction Filter"
    id: direction_filter_select
    options:
      - "Both"
      - "Approaching Only"
      - "Leaving Only"
    initial_option: "Both"
    optimistic: true
    restore_value: true
    icon: "mdi:arrow-left-right"
    on_value:
      then:
        - lambda: |-
            uint8_t filter = 0;
            if (x == "Approaching Only") filter = 1;
            else if (x == "Leaving Only") filter = 2;
            id(radar).set_direction_filter(filter);

# Time for hourly updates and midnight reset
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Reset statistics at midnight
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(radar).reset_statistics();
    on_time_sync:
      then:
        - lambda: |-
            auto time = id(homeassistant_time).now();
            if (time.is_valid()) {
              id(radar).set_current_hour(time.hour);
            }

# Update current hour and publish stats via MQTT
interval:
  - interval: 1min
    then:
      - lambda: |-
          auto time = id(homeassistant_time).now();
          if (time.is_valid()) {
            id(radar).set_current_hour(time.hour);
          }

  # Publish full statistics via MQTT every 30 seconds
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_enabled);'
          then:
            - mqtt.publish_json:
                topic: !lambda 'return "speed_radar/" + App.get_name() + "/stats";'
                payload: |-
                  root["vehicle_count"] = id(vehicle_count).state;
                  root["approaching_count"] = id(approaching_count).state;
                  root["leaving_count"] = id(leaving_count).state;
                  root["average_speed"] = id(average_speed).state;
                  root["max_speed"] = id(max_speed).state;
                  root["speeder_count"] = id(speeder_count).state;
                  root["violation_percentage"] = id(violation_percentage).state;
                  root["worst_speeder"] = id(worst_speeder).state;
                  root["percentile_85"] = id(percentile_85_speed).state;
                  root["peak_hour"] = id(peak_hour).state;
                  root["peak_hour_count"] = id(peak_hour_count).state;

# Switch to enable/disable MQTT publishing
switch:
  - platform: template
    name: "Enable MQTT"
    id: mqtt_enable_switch
    icon: "mdi:access-point"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - lambda: 'id(mqtt_enabled) = true;'
        - logger.log: "MQTT enabled - instant updates active"
    on_turn_off:
      then:
        - lambda: 'id(mqtt_enabled) = false;'
        - logger.log: "MQTT disabled"
