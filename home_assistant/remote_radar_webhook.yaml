# ============================================================
# STEP 5: CONFIG SYNC SCRIPT (Optional - for manual sync)
# ============================================================
# Add to scripts.yaml
# This script can be called to force a config sync

script:
  speed_radar_sync_config:
    alias: "Speed Radar - Sync Config to All Devices"
    description: "Forces all radars to fetch new configuration"
    sequence:
      - service: persistent_notification.create
        data:
          title: "Speed Radar Config"
          message: "Config sync requested. Radars will update within 60 seconds."

# ============================================================
# HOW DEVICE IDENTIFICATION WORKS
# ============================================================
#
# 1. Each ESP has a "Device Location" setting (e.g., "Main Street")
#
# 2. When ESP sends data, it includes: {"device": "Main Street", ...}
#
# 3. HA uses template: {{ trigger.json.device | slugify }}
#    "Main Street" → "main_street"
#
# 4. This creates entities like:
#    - sensor.main_street_radar
#    - input_number.main_street_vehicle_count
#
# 5. To add a new radar location:
#    a. Set unique "Device Location" on the ESP
#    b. Create input helpers with matching slugified prefix
#    c. The template sensor auto-creates from webhook data
#
# ============================================================
# SECURITY NOTES
# ============================================================
#
# - Webhook ID is a 20+ character secret (like a password)
# - Use HTTPS (Cloudflare Tunnel or similar)
# - Each device uses the same webhook ID but identifies via "device" field
# - To add per-device security, use unique webhook IDs per device
#
